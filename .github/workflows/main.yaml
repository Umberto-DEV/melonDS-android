# This is a basic workflow to help you get started with Actions

name: melonDS Android Nightly Build

# Controls when the action will run.
on:
  # Triggers the workflow on push to any branch
  push:
    branches: [ '**' ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Forks produce CI test artifacts; only upstream retains nightly publication.
jobs:
  build:
    if: github.repository == 'rafaelvcaetano/melonDS-android'
    permissions:
      contents: write
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: zulu
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Build melonDS Android
        env:
          MELONDS_KEYSTORE: ${{ secrets.MELONDS_KEYSTORE }}
          MELONDS_KEYSTORE_PASSWORD: ${{ secrets.MELONDS_KEYSTORE_PASSWORD }}
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          sed -i -e 's/\(versionName = "\)\(.*\)\("\)/\1\2 ('"$COMMIT"')\3/g' buildSrc/src/main/kotlin/AppConfig.kt
          echo "$MELONDS_KEYSTORE" | base64 -d > ${{ runner.temp }}/keystore.jks
          echo "MELONDS_KEYSTORE=${{ runner.temp }}/keystore.jks" >> local.properties
          echo "MELONDS_KEYSTORE_PASSWORD=$MELONDS_KEYSTORE_PASSWORD" >> local.properties
          echo "MELONDS_KEY_ALIAS=melonds" >> local.properties
          echo "MELONDS_KEY_PASSWORD=$MELONDS_KEYSTORE_PASSWORD" >> local.properties
          sh ./gradlew :app:assembleGitHubNightlyRelease
          git tag -m "Nightly Release" -f -a nightly-release
          git push -f origin refs/tags/nightly-release

      - name: Update GitHub Nightly Release
        id: update_release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: nightly-release
          name: 'Nightly Build'
          body: 'The currently Nightly Build. Whenever new changes are pushed, you can find the latest build here. You can keep this installation alongside your main one.'
          artifacts: app/build/outputs/apk/gitHubNightly/release/app-gitHub-nightly-release.apk
          artifactContentType: application/vnd.android.package-archive

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: melonDS-android
          path: app/build/outputs/apk/gitHubNightly/release/app-gitHub-nightly-release.apk

  fork-ci:
    if: github.repository != 'rafaelvcaetano/melonDS-android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: zulu
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Test and build ARM64 CI APK
        run: >-
          sh ./gradlew :app:testGitHubNightlyDebugUnitTest
          :app:assembleGitHubNightlyProfiling
          -Pandroid.injected.build.abi=arm64-v8a
          -Pandroid.injected.testOnly=false

      # Debug signing generated by CI: this is not the official release APK.
      - name: Upload CI-signed test build
        uses: actions/upload-artifact@v4
        with:
          name: melonDS-android-CI-signed-test-build-arm64
          path: app/build/intermediates/apk/gitHubNightly/profiling/app-gitHub-nightly-profiling.apk
          if-no-files-found: error
